name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint va testlar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Bog'liqliklarni o'rnatish
        run: npm ci

      - name: ESLint
        run: npm run lint:js

      - name: Stylelint
        run: npm run lint:css

      - name: Formatlash tekshiruvi
        run: npm run lint:format

      - name: Unit testlar
        run: npm test

  e2e:
    name: Brauzer testlari
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Bog'liqliklarni o'rnatish
        run: npm ci

      - name: Chromium o'rnatish
        run: npx playwright install --with-deps chromium

      - name: Playwright testlari
        run: npm run test:e2e

      - name: Hisobotni saqlash
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
