<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f2ea" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Shriftlar `<head>` dan yuklanadi. Ilgari ular CSS `@import` orqali kelardi:
         brauzer avval style.css ni yuklab, parse qilib, keyingina shrift so'rovini
         ko'rar edi — bu ortiqcha kutish zanjiri. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
    />
    <meta name="description" content="Oqim — Oydinda fikrlarni tez yozib saqlash uchun joy." />
    <title>Oydin — Oqim</title>
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/oqim.css" />
  </head>
  <body class="oqim-page">
    <a class="skip-link" href="#main">Asosiy kontentga o‘tish</a>
    <div class="site-shell">
      <header class="topbar landing-bar">
        <a class="brand" href="/index.html" aria-label="Oydin bosh sahifa">
          <span class="brand-symbol" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <mask id="brandCut">
                <rect width="64" height="64" fill="#fff" />
                <rect
                  x="-10"
                  y="30.7"
                  width="84"
                  height="3.2"
                  fill="#000"
                  transform="rotate(-32 32 32)"
                />
              </mask>
              <clipPath id="brandLower">
                <rect x="-10" y="33.9" width="84" height="44" transform="rotate(-32 32 32)" />
              </clipPath>
              <g mask="url(#brandCut)">
                <path
                  class="brand-arc"
                  fill-rule="evenodd"
                  d="M8 32a24 24 0 1 0 48 0a24 24 0 1 0 -48 0ZM23.0 29.5a11.5 11.5 0 1 0 23.0 0a11.5 11.5 0 1 0 -23.0 0Z"
                />
                <g clip-path="url(#brandLower)">
                  <path
                    class="brand-arc-accent"
                    fill-rule="evenodd"
                    d="M8 32a24 24 0 1 0 48 0a24 24 0 1 0 -48 0ZM23.0 29.5a11.5 11.5 0 1 0 23.0 0a11.5 11.5 0 1 0 -23.0 0Z"
                  />
                </g>
              </g>
            </svg>
          </span>
          <span class="brand-word">oydin</span>
        </a>
        <nav class="topnav" aria-label="Asosiy">
          <a class="topnav-link" href="/index.html">Oydin</a>
          <a class="topnav-link active" href="/oqim.html" aria-current="page">Oqim</a>
          <a class="topnav-link" href="/map.html">Makon</a>
          <a class="topnav-link" href="/birdaqiqa/">Bir daqiqa</a>
        </nav>
        <div class="topbar-actions">
          <button
            class="icon-button"
            id="themeToggle"
            type="button"
            aria-label="Tungi rejimga o‘tish"
            aria-pressed="false"
          >
            ◐
          </button>
          <a class="outline-button" href="/map.html"
            >Makonni ochish <span aria-hidden="true">↗</span></a
          >
        </div>
      </header>

      <main class="landing view oqim-main" id="main">
        <section>
          <p class="kicker">FIKRLAR OQIMI</p>
          <h1 class="oqim-title">O‘ylaganingizni<br /><span>yozib qo‘ying.</span></h1>
          <p class="hero-lede oqim-lede">
            Bu yerda fikrlar shunchaki saqlanadi. Ularni Makonga faqat xohlaganingizda olib o‘tasiz.
          </p>

          <div class="oqim-capture">
            <label class="visually-hidden" for="ideaInput">Yangi fikr</label>
            <textarea
              id="ideaInput"
              maxlength="1000"
              placeholder="Hozir nimani o‘ylayapsiz?"
            ></textarea>
            <span class="oqim-count" id="ideaCount">0 / 1000</span>
            <div class="oqim-submit-row">
              <p id="oqimStatus" role="status"></p>
              <button class="primary-button compact" id="saveIdea" type="button">
                Saqlash <span aria-hidden="true">→</span>
              </button>
            </div>
          </div>

          <div class="oqim-search">
            <span aria-hidden="true">⌕</span>
            <label class="visually-hidden" for="oqimSearch">Oqimdan qidiring</label>
            <input
              id="oqimSearch"
              type="search"
              autocomplete="off"
              placeholder="Oqimdan qidiring…"
            />
          </div>

          <div id="ideas" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <script type="module" src="/assets/js/boot-oqim.js"></script>
  </body>
</html>
